%YAML 1.2
---
$id: http://devicetree.org/schemas/riscv/sifive,pl2cache0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFive Private L2 Cache Controller

maintainers:
  - Greentime Hu  <greentime.hu@sifive.com>
  - Eric Lin      <eric.lin@sifive.com>

description:
  The SiFive Private L2 Cache Controller is per hart and communicates with both the upstream
  L1 caches and downstream L3 cache or memory, enabling a high-performance cache subsystem.
  All the properties in ePAPR/DeviceTree specification applies for this platform.

allOf:
  - $ref: /schemas/cache-controller.yaml#

select:
  properties:
    compatible:
      contains:
        enum:
          - sifive,pl2cache0
          - sifive,pl2cache1

  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - sifive,pl2cache0
          - sifive,pl2cache1

  cache-block-size:
    const: 64

  cache-level:
    const: 2

  cache-sets:
    const: 512

  cache-size:
    const: 262144

  cache-unified: true

  reg:
    maxItems: 1

  next-level-cache: true

additionalProperties: false

required:
  - compatible
  - cache-block-size
  - cache-level
  - cache-sets
  - cache-size
  - cache-unified
  - reg

examples:
  - |
    pl2@10104000 {
        compatible = "sifive,pl2cache0";
        cache-block-size = <64>;
        cache-level = <2>;
        cache-sets = <512>;
        cache-size = <262144>;
        cache-unified;
        reg = <0x10104000 0x4000>;
        next-level-cache = <&L4>;
    };
